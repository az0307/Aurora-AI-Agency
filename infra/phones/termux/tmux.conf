# ~/.tmux.conf for Termux on a phone (S10 / Reno 11). tmux 3.2+ (Termux ships 3.7).
# Install: see ../TERMUX.md  ·  reload: prefix then r  ·  install plugins: prefix then I
# Built for a touchscreen + the Termux extra-keys row (CTRL/ALT/arrows are on that row).

# --- Basics -----------------------------------------------------------------------
set -g prefix C-a                 # Ctrl-a is easier than Ctrl-b on a phone keyboard
unbind C-b
bind C-a send-prefix              # press Ctrl-a twice to send a real Ctrl-a
set -g mouse on                   # tap panes/tabs, drag borders, swipe to scroll
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g history-limit 20000
set -g base-index 1               # windows start at 1 (easier to reach on extra keys)
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on
setw -g mode-keys vi

# --- Keys (big, simple, memorable) ---------------------------------------------------
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind | split-window -h -c "#{pane_current_path}"     # side by side (landscape)
bind - split-window -v -c "#{pane_current_path}"     # stacked (portrait: better on a phone)
bind c new-window -c "#{pane_current_path}"
bind -n M-Left  select-pane -L                       # ALT+arrows on the extra-keys row
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind z resize-pane -Z                                # zoom a pane to full screen (toggle)
bind S command-prompt -p "ssh to:" "new-window -n %1 'ssh %1'"
bind A new-window -n aurora 'mosh aurora-01 -- tmux new -A -s main || ssh aurora-01 -t tmux new -A -s main'

# --- Theme: Catppuccin v2 (load BEFORE the status-line settings) ---------------------
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
run ~/.tmux/plugins/tmux/catppuccin.tmux

set -g status-position top                            # keyboard covers the bottom on a phone
set -g status-left-length 60
set -g status-right-length 60
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_battery}"   # needs Termux:API (termux-battery-status)
# No CPU/RAM modules here: Android blocks apps from reading /proc/stat, they'd show errors.

# --- Plugins (TPM) ------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.3.1'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-yank'            # copy in tmux -> Android clipboard (termux-clipboard-set)
set -g @plugin 'tmux-plugins/tmux-resurrect'       # prefix Ctrl-s save, prefix Ctrl-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'       # auto-save every 15 min, auto-restore on start
set -g @plugin 'sainnhe/tmux-fzf'                  # prefix F: fuzzy-find sessions/windows/commands

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @override_copy_command 'termux-clipboard-set'   # tmux-yank: use the Android clipboard
set -g @yank_selection_mouse 'clipboard'

run '~/.tmux/plugins/tpm/tpm'                      # keep this as the LAST line
