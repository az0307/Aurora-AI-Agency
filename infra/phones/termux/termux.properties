# ~/.termux/termux.properties — Termux settings for a phone. Apply with: termux-reload-settings
# Two rows of extra keys above the keyboard, laid out for tmux (Ctrl-a prefix) + shell work.
extra-keys = [ \
  ['ESC','CTRL','ALT','TAB','|','-','/','~','UP','ENTER'], \
  [{key: 'KEYBOARD', popup: 'DRAWER'},{macro: 'CTRL a', display: 'tmux'},{macro: 'CTRL a z', display: 'zoom'},{macro: 'CTRL a c', display: '+win'},'HOME','END','PGUP','LEFT','DOWN','RIGHT'] \
]
extra-keys-style = arrows-all
# Volume-down + key = CTRL shortcut is on by default; keep volume keys for volume:
volume-keys = volume
# Don't close the session on 'exit' by accident; Back key = ESC (handy in vim/tmux copy mode):
back-key = escape
# Let the tmux status bar and long lines breathe:
terminal-margin-horizontal = 3
# Bell = short vibration instead of a sound:
bell-character = vibrate
# Allow `termux-open` / external apps to hand files and URLs to Termux:
allow-external-apps = true
