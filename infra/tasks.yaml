  - id: T020
    title: Harden operator-box low-severity items from the audit
    area: security
    status: done
    owner: agent
    files: [infra/hetzner/provision.sh, infra/hetzner/preflight.sh, infra/hostinger/provision.sh, infra/check.sh, infra/hostinger/post-install.sh, infra/stacks/openbot/.env.example]
    acceptance: ["curl passes Bearer tokens via --config/@fd, not argv (out of /proc/PID/cmdline)", "post-install.done marker not written on partial failure", "openbot .env comment points at http://litellm:4000 on aurora-llm, not 172.17.0.1:4000"]
    notes: >
      Done 2026-09-28. All LOW, operator-box self-exposure only. Bearer tokens (HCLOUD/HETZNER
      in hetzner/provision.sh + preflight.sh, HOSTINGER in hostinger/provision.sh, LITELLM router
      key in check.sh) now go through `curl --config <(printf ...)` on a pipe — printf is a bash
      builtin so the token is never a child process's argv and never touches /proc/PID/cmdline or
      disk. Verified with a local echo server. post-install.sh now gates the .done marker behind
      the essentials (aurora user, SSH key, docker); on a partial run it writes .failed and exits
      1 instead. openbot .env.example comment corrected to http://litellm:4000/v1 on aurora-llm.
      No secret ever ships or persists world-readable.

  # --- Found by the 2026-09-28 audit (read-only subagent) + the n8n end-to-end test ------------
  - id: T021
    title: n8n can't reach the router — join it to aurora-llm
    area: n8n
    status: done
    owner: agent
    files: [infra/stacks-up.sh]
    acceptance: ["docker exec n8n-n8n-1 wget -qO- http://router-litellm-1:4000/health/liveliness → 200"]
    notes: >
      stacks-up.sh's n8n override now joins aurora-llm (and is rewritten on boxes that have the old
      one). New ensure_llm_net pre-creates the network with the router's compose labels when the
      router hasn't run yet — a plain `docker network create` makes the router refuse it (tested
      both). Verified from inside n8n.
  - id: T022
    title: Aurora n8n workflows never worked — fix webhooks, JSON, and prompt bodies
    area: n8n
    status: done
    owner: agent
    files: [infra/stacks/n8n/workflows/]
    acceptance: ["console task reaches the router with the user's text", "health digest still sends when the router is down"]
    notes: >
      End-to-end test in real n8n found four blockers: no webhookId on webhook nodes (n8n registered
      <wf-id>/<node>/<path>, so /webhook/assistant-intake 404'd — all 7 webhook workflows in the
      library fixed); raw-JSON Set nodes concatenating outside {{ }} (invalid JSON, confirmed by n8n);
      router jsonBody not an expression (model got the literal "={{ $json.text }}"); stray "=" in
      date strings. Also: assistant-intake now uses its lane-aware system prompt; health digest and
      runsheet report up/DOWN from the status code and keep going when a check fails. Verified: text
      with quotes arrives intact on the paid general chain; digest shows router=DOWN with the router
      stopped; lead record is clean.
