      stand-in container; no other .env value is ever printed. On-box follow-up: T031.

  - id: T013
    title: Migrate n8n Postgres 16 -> 17
    area: n8n
    status: done
    owner: agent
    depends_on: [T009]
    acceptance: ["backup taken", "restore into PG17 volume", "n8n healthy on 17"]
    notes: >
      Tooling done 2026-09-28: `aurora maintain pg-upgrade`. Compose now takes POSTGRES_IMAGE_TAG +
      PG_VOLUME_NAME (defaults = 16 on n8n_pg_data, so existing boxes are untouched; fresh installs get 17
      on n8n_pg_data17 via .env.example). The command asks (type 'upgrade'), takes a full backup, dumps,
      starts 17 on a NEW volume, restores, compares every table's row count, starts n8n and waits for
      /healthz; any failure rolls back to 16 automatically. Staging-tested on real Docker (old compose →
      new files → upgrade): 143 tables / 270 n8n migrations preserved, 0 migrations re-run, n8n healthy on
      17.11; manual rollback and forced-failure auto-rollback both return to 16 with data intact.
      Running it on aurora-01 is T031.

