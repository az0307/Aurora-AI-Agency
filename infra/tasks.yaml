    files: [infra/stacks/n8n/.env.example, infra/stacks/n8n/docker-compose.yml]
    acceptance: ["tag pinned to current `n8n --version`", "upgrade is a deliberate change"]
    notes: >
      Done 2026-09-28. Compose default is 2.41.3 (T019). The live box keeps its own .env, so check.sh
      now has an "Image pins" section: it warns on any stack .env tag = latest (and any container running
