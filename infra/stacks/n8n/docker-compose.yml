# Self-hosted "Zapier" = n8n + Postgres, fronted by Caddy for automatic HTTPS.
# Use this on a box WITHOUT Dokploy. With Dokploy, deploy n8n through Dokploy (it
# provides Traefik + TLS) and drop the caddy service.
#
# Setup:  cp .env.example .env  &&  edit  &&  docker compose up -d
# Reach n8n via Cloudflare Tunnel + Access, or the Caddy-served domain below.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${WEBHOOK_URL:-https://localhost/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Australia/Melbourne}
      # LOGIN GATE: n8n's built-in owner account (set on first run in the UI).
      # n8n REMOVED N8N_BASIC_AUTH_* in v1.0 — those vars are ignored on current
      # images, so they are intentionally not set here. Cloudflare Access is the
      # real outer gate; keep n8n behind it. To pre-provision the owner from env
      # instead of the first-run screen, set N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true
      # plus the owner vars (see n8n user-management docs).
      # Encryption key must be stable across restarts (back it up!):
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      # Restrict CORS from wildcard once the real domain is known (Y.M.I open item):
      N8N_CORS_ALLOW_ORIGIN: ${N8N_CORS_ALLOW_ORIGIN:-https://localhost}
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - "5678"
    # Tunnel-only mode (recommended): uncomment to publish n8n on loopback so a
    # host-installed cloudflared can reach it, and REMOVE the caddy service below
    # (Cloudflare terminates TLS at the edge). Keep Caddy only for public-DNS/no-tunnel setups.
    # ports:
    #   - "127.0.0.1:5678:5678"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - n8n
    ports:
      - "80:80"
      - "443:443"
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg_data:
  n8n_data:
  caddy_data:
  caddy_config:
