# Homepage: a single start-page over every service (with widgets for Docker, n8n,
# Uptime Kuma, Beszel, etc). Config lives in ./config (mounted). Behind Cloudflare Access.
#
#   docker compose up -d
# Edit ./config/services.yaml to add tiles; docs: https://gethomepage.dev

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-dash.example.com}
    volumes:
      - ./config:/app/config
      # read-only docker socket enables the Docker widget (container status tiles):
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # Host 3002 (Dokploy already owns 3000); container still listens on 3000.
      - "127.0.0.1:3002:3000"
