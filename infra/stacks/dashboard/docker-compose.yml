# dashboard — Homepage: the start page with every Aurora link + live container status.
#
#   bash /opt/aurora/stacks-up.sh dashboard  # → 127.0.0.1:3002, tailnet https://aurora-01.<tailnet>.ts.net:3002
#
# Links point at the tailnet names, so bookmark it on the phones. Config is in ./config
# (shipped from the repo; HOMEPAGE_VAR_TS is filled in by stacks-up.sh). The Docker socket
# is mounted read-only just to show which containers are up.
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.4.0
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:3002:3000"
