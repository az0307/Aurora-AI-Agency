# OpenHands: autonomous coding agent that runs SANDBOXED in Docker — the safe way to
# let an agent browse/execute on a VPS without touching the host. Hosted-API backend.
# Front it with Cloudflare Access; give it a scoped workspace only.
#
#   cp .env.example .env  &&  edit  &&  docker compose up -d
# Then open the UI (behind Access) and set your model + API key in-app, or via env below.
# Docs: https://docs.all-hands.dev  (confirm current image tag before deploying)

services:
  openhands:
    image: docker.all-hands.dev/all-hands-ai/openhands:latest
    restart: unless-stopped
    environment:
      # OpenHands launches per-task sandbox containers using this runtime image:
      SANDBOX_RUNTIME_CONTAINER_IMAGE: ${SANDBOX_IMAGE:-docker.all-hands.dev/all-hands-ai/runtime:latest}
      LOG_ALL_EVENTS: "true"
      # Optional: preset the model/key instead of entering it in the UI.
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-opus-4-8}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      # ⚠️ SECURITY: OpenHands needs the Docker socket to spawn its per-task sandbox
      # containers, but a writable docker.sock is ROOT-EQUIVALENT on the host — a
      # compromised agent could launch a privileged container and escape. Because
      # OpenHands cannot function without it, DO NOT run this stack on a box with
      # anything else valuable. Mitigations (in order of preference):
      #   1. Run it ONLY on a disposable, isolated box (the Oracle free lab), never
      #      alongside client data or the n8n/agency stacks.
      #   2. Point it at a ROOTLESS Docker daemon (DOCKER_HOST=unix:///run/user/<uid>/docker.sock)
      #      so socket access is not host-root.
      #   3. Or run it in a dedicated VM/microVM (Firecracker) rather than sharing the host.
      - /var/run/docker.sock:/var/run/docker.sock
      - openhands_state:/.openhands
    ports:
      # Host 3003, NOT 3000: Dokploy's UI owns 3000 on this box (see runbooks/DAY1.md),
      # and 3001/3002 are Uptime Kuma / Homepage. Container still listens on 3000.
      - "127.0.0.1:3003:3000"

volumes:
  openhands_state:
